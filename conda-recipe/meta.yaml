{% set name = "bridge" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv"

requirements:
  host:
    - python >=3.10,<3.13
    - pip
    - setuptools >=69
    - wheel
  run:
    - python >=3.10,<3.13
    - numpy >=1.24
    - pandas >=2.0
    - scikit-learn >=1.3
    - pytorch >=2.1
    - joblib >=1.3

test:
  imports:
    - bridge
  commands:
    - python -c "from bridge import BridgePredictor; print('Bridge import OK')"

about:
  home: https://github.com/eonurk/Bridge
  summary: Bridge inference package for count-matrix to leukemia prediction workflows
  license: CC-BY-NC-4.0
  license_file: LICENSE
