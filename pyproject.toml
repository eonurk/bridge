[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Bridge"
version = "0.2.0"
description = "Bridge inference package for count-matrix to latent/prediction workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-NC-4.0" }
authors = [{ name = "E. Onur Karakaslar" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "joblib>=1.3",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[project.scripts]
bridge = "bridge.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
